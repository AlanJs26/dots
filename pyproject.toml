[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archdots"
version = "0.1.0"
description = "simple cli tool for managing dotfiles, packages and configuration scripts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argparse>=1.4.0",
    "dacite>=1.8.1",
    "deepmerge>=2.0",
    "inquirer>=3.4.0",
    "lark>=1.2.2",
    "pyside6>=6.8.1",
    "pyyaml>=6.0.2",
    "rich>=13.9.4",
    "slint>=1.14.1b1",
]

# Mapeia a pasta externa para dentro do pacote instalado
[tool.hatch.build.targets.wheel.force-include]
"commands" = "archdots/commands"
"chezmoi_template" = "archdots/chezmoi_template"
"default_packages" = "archdots/default_packages"

# Garante que o modo editável (-e) também enxergue esse mapeamento
[tool.hatch.build.targets.editable]
path = "."

[project.scripts]
dots = "archdots:main"
